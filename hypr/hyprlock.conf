$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.config/wallpapers/Wallpaper.png
    blur_passes = 2
}

input-field {
    monitor =
    size = 15%, 4%
    outline_thickness = 2
    inner_color = rgba(0d0d0d00)

    outer_color = rgba(adadadff)
    check_color = rgba(e6e6e6ff)
    fail_color = rgba(666666ff)

    font_color = rgb(230, 230, 230)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text =
    fail_text = $PAMFAIL$FPRINTFAIL

    check_text = Authenticating...
    dots_size = 0.2
    dots_spacing = 0.3

    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 55
    font_family = Iosevka

    position = 0, -125
    halign = center
    valign = top
    color = rgba(E6E6E6)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 15
    font_family = $font

    position = 0, -230
    halign = center
    valign = top
    color = rgba(E6E6E6)
}


